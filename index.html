<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101310"><meta name="description" content="Naija Social — what Nigeria is talking about.">
<title>Naija Social — Your voice, your people</title>
<style>
:root{--bg:#0d100e;--panel:#151a16;--panel2:#1c231d;--line:#2a332b;--text:#f3f5f2;--muted:#a2ada3;--green:#9be36b;--green2:#c5f5a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;display:grid;grid-template-columns:230px minmax(0,620px) 290px;gap:24px;padding:0 18px}.left,.right{position:sticky;top:0;height:100vh;padding:24px 0}.logo{font-weight:900;font-size:24px;letter-spacing:-1px;margin:5px 0 28px}.logo span{color:var(--green)}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:var(--text);padding:12px 14px;text-align:left;border-radius:13px;font-size:16px}.nav button:hover,.nav button.active{background:var(--panel2)}.nav button.active{font-weight:750}.post-btn,.primary{background:var(--green);color:#10160c;border:0;border-radius:999px;padding:12px 20px;font-weight:800}.post-btn{width:100%;margin-top:22px}.main{min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}.top{position:sticky;top:0;z-index:2;background:#0d100eeF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:17px 20px;font-weight:850;font-size:19px}.composer{padding:20px;border-bottom:1px solid var(--line);display:flex;gap:12px}.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#c5f5a3,#638f48);color:#172011;font-weight:900}.compose-area{flex:1;min-width:0}.compose-area textarea{width:100%;resize:vertical;min-height:75px;background:transparent;border:0;color:var(--text);outline:none;font-size:16px}.compose-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}.hint{font-size:12px;color:var(--muted)}.feed-post{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px}.post-content{min-width:0;flex:1}.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.name{font-weight:800}.handle,.time{color:var(--muted);font-size:13px}.verified{color:var(--green)}.post-text{margin:8px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;justify-content:space-between;max-width:460px;color:var(--muted)}.actions button{border:0;background:none;color:inherit;padding:5px 8px;border-radius:8px}.actions button:hover{color:var(--green);background:#9be36b12}.right-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:16px}.right-card h3{margin:0 0 12px;font-size:18px}.trend{padding:10px 0;border-bottom:1px solid var(--line)}.trend:last-child{border:0}.trend small{display:block;color:var(--muted)}.trend b{display:block;margin:2px 0}.search{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;margin-bottom:16px;outline:none}.footer{color:var(--muted);font-size:12px;line-height:2;padding:12px}.empty{padding:38px 20px;text-align:center;color:var(--muted)}.profile{padding:22px 20px;border-bottom:1px solid var(--line)}.profile h2{margin:8px 0 2px}.profile p{color:var(--muted)}.field{display:block;width:100%;padding:12px;margin:8px 0 14px;background:#0d100e;border:1px solid var(--line);border-radius:10px;color:var(--text)}.mobile-nav{display:none}.notice{margin:14px;padding:12px;border-radius:12px;background:#9be36b12;color:var(--green2);font-size:13px}
@media(max-width:980px){.app{grid-template-columns:75px minmax(0,620px);justify-content:center;gap:0}.left{padding-right:10px}.right{display:none}.logo{font-size:0}.logo:first-letter{font-size:25px}.nav button{font-size:0;text-align:center;padding:13px 4px}.nav button:before{font-size:19px;content:attr(data-icon)}.post-btn{font-size:0;padding:14px}.post-btn:before{content:'+';font-size:24px}.main{width:100%}}@media(max-width:600px){.app{display:block;padding:0}.left{display:none}.main{border:0;padding-bottom:64px}.top{padding:15px 16px}.composer,.feed-post{padding:15px 14px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#101310f5;border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px;z-index:5}.mobile-nav button{background:none;border:0;color:var(--text);font-size:20px;padding:4px 10px}.mobile-nav button.active{color:var(--green)}}
</style></head>
<body><div class="app">
<aside class="left"><div class="logo">NAIJA<span>.</span>SOCIAL</div><nav class="nav" id="desktopNav"><button class="active" data-page="Home" data-icon="⌂">⌂ &nbsp; Home</button><button data-page="Explore" data-icon="⌕">⌕ &nbsp; Explore</button><button data-page="Notifications" data-icon="♧">♧ &nbsp; Notifications</button><button data-page="Profile" data-icon="◉">◉ &nbsp; Profile</button><button data-page="Verification" data-icon="✓">✓ &nbsp; Get verified</button></nav><button class="post-btn" onclick="focusComposer()">Post</button></aside>
<main class="main"><header class="top" id="pageTitle">Home</header><div id="pageBody"></div></main>
<aside class="right"><input class="search" id="searchBox" placeholder="Search Naija Social" aria-label="Search posts"><section class="right-card"><h3>What's happening</h3><div id="trends"></div></section><section class="right-card"><h3>Join the conversation</h3><p style="color:var(--muted)">A home for Nigerian voices, ideas, culture and creativity.</p><button class="primary" onclick="focusComposer()">Write a post</button></section><div class="footer">About · Community guidelines · Privacy · Terms<br>Naija Social · Built for the conversation.</div></aside>
</div><nav class="mobile-nav"><button data-page="Home" class="active">⌂</button><button data-page="Explore">⌕</button><button onclick="focusComposer()">＋</button><button data-page="Notifications">♧</button><button data-page="Profile">◉</button></nav>
<script>
const seedPosts=[
{id:1,name:"Ada Okafor",handle:"adaokafor",verified:true,time:"12m",text:"Nigeria has no shortage of talent. Imagine what happens when we build more platforms that let our people be seen. 🇳🇬",likes:128,reposts:32,replies:18},
{id:2,name:"Tunde Creates",handle:"tundecreates",verified:false,time:"28m",text:"Creators: what is one thing Nigerian brands could do better when working with you?",likes:67,reposts:14,replies:41},
{id:3,name:"Zara",handle:"zara_says",verified:false,time:"1h",text:"Small wins count too. Send that proposal. Post that work. Start that thing. Your future self will thank you.",likes:94,reposts:21,replies:9}
];
let posts=JSON.parse(localStorage.getItem("naija-social-posts")||"null")||seedPosts;
let liked=JSON.parse(localStorage.getItem("naija-social-liked")||"[]");
let page="Home",query="";
const profile=JSON.parse(localStorage.getItem("naija-social-profile")||'{"name":"Your Name","handle":"yourhandle","bio":"Finding my voice on Naija Social 🇳🇬"}');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("naija-social-posts",JSON.stringify(posts));localStorage.setItem("naija-social-liked",JSON.stringify(liked))}
function focusComposer(){page="Home";render();setTimeout(()=>document.querySelector("#newPost")?.focus(),0)}
function postCard(p){return '<article class="feed-post"><div class="avatar">'+esc(p.name.slice(0,1).toUpperCase())+'</div><div class="post-content"><div class="meta"><span class="name">'+esc(p.name)+'</span>'+(p.verified?'<span class="verified">✓</span>':'')+'<span class="handle">@'+esc(p.handle)+'</span><span class="time">· '+esc(p.time)+'</span></div><div class="post-text">'+esc(p.text)+'</div><div class="actions"><button onclick="reply('+p.id+')">♧ '+(p.replies||0)+'</button><button onclick="repost('+p.id+')">↻ '+(p.reposts||0)+'</button><button onclick="toggleLike('+p.id+')">'+(liked.includes(p.id)?'♥':'♡')+' '+(p.likes||0)+'</button><button onclick="sharePost('+p.id+')">↗ Share</button></div></div></article>'}
function composer(){return '<section class="composer"><div class="avatar">'+esc(profile.name.slice(0,1).toUpperCase())+'</div><div class="compose-area"><textarea id="newPost" maxlength="500" placeholder="What is happening in Nigeria?"></textarea><div class="compose-bottom"><span class="hint">Keep it real. Keep it respectful.</span><button class="primary" onclick="publish()">Post</button></div></div></section>'}
function render(){document.querySelector("#pageTitle").textContent=page;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let body=document.querySelector("#pageBody");
if(page==="Home"){body.innerHTML=composer()+posts.filter(p=>(p.text+" "+p.name+" "+p.handle).toLowerCase().includes(query)).map(postCard).join("")||'<div class="empty">No posts match your search.</div>'}
else if(page==="Explore"){body.innerHTML='<div class="notice">Explore conversations from across Nigeria. Try searching by keyword.</div>'+posts.slice().reverse().map(postCard).join("")}
else if(page==="Notifications"){body.innerHTML='<div class="empty"><h2>You are all caught up</h2><p>When people interact with your posts, notifications will appear here in a future connected version.</p></div>'}
else if(page==="Profile"){body.innerHTML='<section class="profile"><div class="avatar">'+esc(profile.name.slice(0,1).toUpperCase())+'</div><h2>'+esc(profile.name)+'</h2><div class="handle">@'+esc(profile.handle)+'</div><p>'+esc(profile.bio)+'</p><b>'+posts.filter(p=>p.handle===profile.handle).length+'</b> posts</section><form style="padding:20px" onsubmit="saveProfile(event)"><h3>Edit your demo profile</h3><label>Name<input class="field" id="profName" maxlength="40" value="'+esc(profile.name)+'" required></label><label>Username<input class="field" id="profHandle" maxlength="24" value="'+esc(profile.handle)+'" required></label><label>Bio<textarea class="field" id="profBio" maxlength="160">'+esc(profile.bio)+'</textarea></label><button class="primary">Save profile</button></form>'+posts.filter(p=>p.handle===profile.handle).map(postCard).join("")}
else if(page==="Verification"){body.innerHTML='<div style="padding:24px 20px"><div class="avatar">✓</div><h2>Get verified</h2><p style="color:var(--muted)">A verification subscription is planned for a future release.</p><section class="right-card"><h3>Naija Plus — planned</h3><div style="font-size:30px;font-weight:900">₦1,000 <small style="font-size:14px;color:var(--muted)">/ month (illustrative)</small></div><p style="color:var(--muted)">Potential benefits: verification badge, creator tools and account support.</p><button class="primary" onclick="alert(\'Payments are not enabled in this prototype. No money will be collected.\')">Coming soon</button></section><p class="hint">The price is a test placeholder, not an active offer. This page does not verify identity or process payments.</p></div>'}
document.querySelector("#trends").innerHTML=[["#NaijaTech","Tech & startups"],["#CreatorEconomy","Creators & culture"],["#Nigeria","Across the country"]].map(t=>'<div class="trend"><small>Trending in Nigeria</small><b>'+t[0]+'</b><small>'+t[1]+'</small></div>').join("")}
function publish(){let el=document.querySelector("#newPost"),text=el?.value.trim();if(!text)return;posts.unshift({id:Date.now(),name:profile.name,handle:profile.handle,verified:false,time:"now",text,likes:0,reposts:0,replies:0});save();render()}
function toggleLike(id){let p=posts.find(p=>p.id===id);if(!p)return;if(liked.includes(id)){liked=liked.filter(x=>x!==id);p.likes=Math.max(0,p.likes-1)}else{liked.push(id);p.likes++}save();render()}
function repost(id){let p=posts.find(p=>p.id===id);if(p){p.reposts++;save();render()}}
function reply(id){const msg=prompt("Write a reply (demo only):");if(msg?.trim()){let p=posts.find(p=>p.id===id);p.replies++;save();alert("Reply preview: "+msg.trim()+"\nReplies are not shared online yet.");render()}}
function sharePost(id){let p=posts.find(p=>p.id===id);if(p)navigator.clipboard?.writeText(p.text).then(()=>alert("Post text copied.")).catch(()=>alert(p.text))}
function saveProfile(e){e.preventDefault();profile.name=document.querySelector("#profName").value.trim();profile.handle=document.querySelector("#profHandle").value.trim().replace(/^@/,"").replace(/\s/g,"");profile.bio=document.querySelector("#profBio").value.trim();localStorage.setItem("naija-social-profile",JSON.stringify(profile));render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;query="";document.querySelector("#searchBox").value="";render()}));
document.querySelector("#searchBox").addEventListener("input",e=>{query=e.target.value.toLowerCase();page="Home";render()});
render();
</script></body></html>
